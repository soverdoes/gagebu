<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>두 사람 가계부</title>
<style>
/* 독립 실행용 기본값 (아티팩트 래퍼가 주던 것) */
html{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* 설치된 Pretendard 를 웨이트별로 정확히 집어온다 (Windows 는 웨이트마다 패밀리가 갈린다) */
@font-face{font-family:PretendardKR;font-weight:400;font-style:normal;
  src:local("Pretendard Regular"),local("Pretendard-Regular"),local("Pretendard")}
@font-face{font-family:PretendardKR;font-weight:500;font-style:normal;
  src:local("Pretendard Medium"),local("Pretendard-Medium")}
@font-face{font-family:PretendardKR;font-weight:600;font-style:normal;
  src:local("Pretendard SemiBold"),local("Pretendard-SemiBold")}
@font-face{font-family:PretendardKR;font-weight:700;font-style:normal;
  src:local("Pretendard Bold"),local("Pretendard-Bold"),local("Pretendard ExtraBold")}
:root{
  --ground:#EBEEF3; --surface:#FFFFFF; --surface-2:#F5F7FA;
  --ink:#0E141B; --ink-2:#33414F; --muted:#5B6875; --faint:#8A97A4;
  --line:#D6DDE5; --line-soft:#E5EAF0;
  --accent:#0E7061; --accent-soft:#E2F0ED; --bar:#0E8A72; --bar-soft:#E1F1EC;
  --pA:#1F6FB2; --pA-soft:#E6EFF8;
  --pB:#C56A16; --pB-soft:#FAEDE0;
  --neg:#B3352C; --pos:#0E7061; --bibik:#B5348A; --bibik-soft:#FAE9F4;
  --v1-bg:#EFE8FB; --v1-fg:#6B3FC4; --v1-bd:#D9CBF4;   /* 예금 · 보라 */
  --v2-bg:#FCE8F0; --v2-fg:#C0357A; --v2-bd:#F4CDDF;   /* 적금 · 자주 */
  --v3-bg:#FAF1DA; --v3-fg:#8F6D12; --v3-bd:#EEDFB6;   /* 투자 · 금색 */
  --shadow:0 1px 2px rgba(14,20,27,.06),0 8px 24px -14px rgba(14,20,27,.22);
  --r:10px;
  --sans:PretendardKR,Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,
         "Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:var(--sans);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#10141A; --surface:#181D24; --surface-2:#1E242C;
    --ink:#E4EAF1; --ink-2:#C3CEDA; --muted:#93A1B0; --faint:#6D7B8A;
    --line:#28313B; --line-soft:#222A33;
    --accent:#3FB8A2; --accent-soft:#123029; --bar:#2FA890; --bar-soft:#12302A;
    --pA:#4E93D8; --pA-soft:#152435;
    --pB:#CB7A2C; --pB-soft:#2E2114;
    --neg:#E27367; --pos:#3FB8A2; --bibik:#DE73B4; --bibik-soft:#301A28;
    --v1-bg:#251C3C; --v1-fg:#8F5FDB; --v1-bd:#3B2C60;
    --v2-bg:#351A28; --v2-fg:#D9558F; --v2-bd:#54293E;
    --v3-bg:#2E2712; --v3-fg:#A88420; --v3-bd:#473A1C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#10141A; --surface:#181D24; --surface-2:#1E242C;
  --ink:#E4EAF1; --ink-2:#C3CEDA; --muted:#93A1B0; --faint:#6D7B8A;
  --line:#28313B; --line-soft:#222A33;
  --accent:#3FB8A2; --accent-soft:#123029; --bar:#2FA890; --bar-soft:#12302A;
  --pA:#4E93D8; --pA-soft:#152435;
  --pB:#CB7A2C; --pB-soft:#2E2114;
  --neg:#E27367; --pos:#3FB8A2; --bibik:#DE73B4; --bibik-soft:#301A28;
  --v1-bg:#251C3C; --v1-fg:#8F5FDB; --v1-bd:#3B2C60;
  --v2-bg:#351A28; --v2-fg:#D9558F; --v2-bd:#54293E;
  --v3-bg:#2E2712; --v3-fg:#A88420; --v3-bd:#473A1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;
  letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;padding-bottom:64px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--sans);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em}

/* ---- header ---- */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.top-in{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:700;letter-spacing:-.01em;font-size:16px}
.brand em{font-style:normal;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:8px}
.tabs button{padding:5px 14px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.09)}
.mini{margin-left:auto;display:flex;align-items:baseline;gap:9px;font-size:12.5px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.mini b.neg{color:var(--neg)}
.mini[hidden]+.io{margin-left:auto}
.io{display:flex;gap:6px;margin-left:14px}
.io .icon{padding:5px 9px;font-size:13px;line-height:1.2}
#btn-account{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#btn-account.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.acct-row{display:flex;align-items:baseline;gap:9px;font-size:13px;padding:7px 0;
  border-bottom:1px solid var(--line-soft)}
.acct-row:last-of-type{border-bottom:none}
.acct-row .k{font-size:11px;letter-spacing:.06em;color:var(--muted);min-width:64px}
.acct-row .v{color:var(--ink);word-break:break-all}
.code-box{display:flex;align-items:center;gap:8px;margin-top:6px}
.code{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.14em;
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 13px}
.acct-note{font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:10px}
.acct-in{width:100%;box-sizing:border-box;margin-top:7px;padding:9px 11px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  font-family:var(--mono);font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.io .icon:disabled{opacity:.32;cursor:default;border-color:var(--line);color:var(--ink-2)}
.io .icon:disabled:hover{border-color:var(--line);color:var(--ink-2)}
.io .ghost{padding:5px 11px;font-size:12px;display:inline-flex;align-items:center;cursor:pointer}
.status{font-size:11.5px;color:var(--faint);letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.status[data-s="saving"] .dot{background:var(--pB)}
.status[data-s="saved"] .dot{background:var(--accent)}
.status[data-s="off"] .dot{background:var(--neg)}

.wrap{max-width:1320px;margin:0 auto;padding:20px}
.modal-back{position:fixed;inset:0;z-index:90;background:rgba(10,14,20,.5);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 24px 60px -18px rgba(0,0,0,.6);padding:20px 22px 17px;width:100%;max-width:400px}
.modal-ttl{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.4}
.modal-body{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
.modal-list{margin:11px 0 0;padding:10px 13px;list-style:none;background:var(--surface-2);
  border-radius:9px;font-size:12.5px;color:var(--ink-2);line-height:1.9}
.modal-list li{position:relative;padding-left:11px}
.modal-list li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;
  border-radius:50%;background:var(--faint)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal-foot .ghost{padding:8px 15px}
.btn-danger,.btn-primary{padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;color:#fff}
.btn-danger{background:var(--neg)}
.btn-primary{background:var(--accent)}
.btn-danger:hover,.btn-primary:hover{filter:brightness(1.08)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  display:flex;align-items:center;gap:16px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:11px;padding:11px 16px;font-size:13px;
  box-shadow:0 12px 34px -12px rgba(0,0,0,.45);max-width:calc(100vw - 32px)}
.toast button{color:var(--accent);font-weight:700;white-space:nowrap}
.toast button:hover{text-decoration:underline}
.notice{margin:0 0 16px;padding:11px 14px;border-radius:var(--r);background:var(--bibik-soft);
  border:1px solid color-mix(in srgb,var(--bibik) 34%,transparent);color:var(--ink-2);font-size:13px}
.notice[hidden]{display:none!important}

/* ---- month bar ---- */
.monthbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.mnav{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.mnav button{padding:7px 12px;color:var(--muted);font-size:15px;line-height:1}
.mnav button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.mnav button:disabled{opacity:.3;cursor:default}
.mnav .cur{padding:6px 4px 6px 10px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.mnav select{border:none;background:none;padding:6px 8px 6px 2px;font-weight:600;cursor:pointer}
.ghost{border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:500;
  background:var(--surface);color:var(--ink-2)}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.ghost.danger:hover{border-color:var(--neg);color:var(--neg)}

/* ---- summary ---- */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line-soft);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px;box-shadow:var(--shadow)}
.tile{background:var(--surface);padding:13px 15px 14px}
.tile.hero{background:var(--surface)}
.tile .k{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:5px}
.tile .v{margin-top:5px;font-size:20px;font-weight:600;letter-spacing:-.02em}
.tile.hero .v{font-size:27px;font-weight:700}
.tile .sub{margin-top:2px;font-size:11.5px;color:var(--faint)}
.v.neg{color:var(--neg)} .v.pos{color:var(--pos)} .v.bibik{color:var(--bibik)}
.tile input{width:100%;border:none;background:none;padding:0;margin-top:5px;font-size:20px;font-weight:600;
  letter-spacing:-.02em;font-family:var(--mono);font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--line)}
.tile input:hover{border-bottom-color:var(--accent)}

/* ---- 비빅(비상금) 통장 흐름 ---- */
.bibik-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--bibik);
  border-radius:var(--r);box-shadow:var(--shadow);padding:13px 18px 15px;margin:-6px 0 22px}
.bb-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.bb-name{font-weight:700;font-size:14px;letter-spacing:-.01em}
.bb-tag{font-size:11px;color:var(--faint);letter-spacing:.05em}
.bb-flow{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.bb-step .k{font-size:10.5px;letter-spacing:.07em;color:var(--muted);font-weight:500;white-space:nowrap}
.bb-step .v{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-top:2px;white-space:nowrap}
.bb-step.edit input{width:9.5ch;border:none;background:none;padding:0;
  border-bottom:1px dashed var(--line);color:var(--ink)}
.bb-step.edit input:hover{border-bottom-color:var(--bibik)}
.bb-step.end .v{color:var(--bibik)}
.bb-flow .v.neg{color:var(--neg)}
.bb-op{font-size:15px;color:var(--faint);padding-bottom:3px;font-family:var(--mono)}
@media (max-width:640px){.bb-op{display:none}.bb-flow{gap:12px 22px}}

/* ---- 식생품 ---- */
.groc-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--bar);
  border-radius:var(--r);box-shadow:var(--shadow);padding:13px 18px 15px;margin:0 0 22px}
.groc-card[hidden]{display:none}
.groc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.groc-name{font-weight:700;font-size:14px;letter-spacing:-.01em}
.groc-tag{font-size:11px;color:var(--faint)}
.groc-base{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;
  padding:5px 10px;font-size:12px;color:var(--ink-2);cursor:pointer;font-weight:500;max-width:230px}
/* 두 줄이 같은 칸 위치를 쓰도록 하나의 격자에 담는다 */
.gf-grid{display:grid;align-items:start;
  grid-template-columns:minmax(120px,max-content) 20px minmax(120px,max-content)
                        20px minmax(150px,max-content);
  column-gap:16px}
.gf-div{grid-column:1/-1;border-top:1px dashed var(--line-soft);margin:13px 0}
@media (max-width:700px){
  .gf-grid{grid-template-columns:1fr 1fr;column-gap:20px;row-gap:10px}
  .gf-div{margin:8px 0}
}
.gf-step{display:flex;flex-direction:column;min-width:0}
.gf-step .k{height:16px;display:flex;align-items:center;white-space:nowrap;
  font-size:10.5px;letter-spacing:.07em;color:var(--muted);font-weight:500}
.gf-step .v{height:32px;display:flex;align-items:center;white-space:nowrap;
  font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1}
.gf-step.big .v{font-size:22px;font-weight:700}
.gf-step input.v{display:block;box-sizing:border-box;width:100%;max-width:11ch;padding:0 1px;
  height:32px;line-height:31px;
  border:none;border-bottom:1px dashed var(--line);border-radius:0;
  background:none;color:var(--ink)}
.gf-step input.v:hover,.gf-step input.v:focus{border-bottom-color:var(--bar)}
.gf-step .hint{height:16px;display:flex;align-items:center;white-space:nowrap;
  font-size:10.5px;color:var(--faint)}
.gf-op{height:32px;margin-top:16px;display:flex;align-items:center;
  font-size:15px;color:var(--faint);font-family:var(--mono)}
.gf-step .v.pos{color:var(--pos)} .gf-step .v.neg{color:var(--neg)}
.groc-cut{color:var(--muted)}
@media (max-width:700px){.gf-op{display:none}}
.groc-meter{height:6px;margin-top:14px!important;border-radius:3px;background:var(--line-soft);overflow:hidden;margin:13px 0 2px;max-width:100%}
.groc-meter i{display:block;height:100%;border-radius:3px;background:var(--bar)}
.groc-pick{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:12px}
.groc-rows{display:flex;flex-direction:column;gap:2px;max-width:420px}
.groc-row{display:flex;align-items:center;gap:8px;padding:3px 0}
.groc-row .gr-chk{margin-right:1px}
.groc-row:not(.on) .gr-nm,.groc-row:not(.on) .gr-am{color:var(--faint)}
.groc-row:hover{background:var(--surface-2);border-radius:6px;margin:0 -6px;padding:2px 6px}
.gr-nm{flex:1 1 auto;min-width:0;font-size:12.5px;border:none;background:none;padding:2px 3px;border-radius:4px}
.gr-am{flex:none;width:104px;text-align:right;font-size:12.5px;border:none;background:none;padding:2px 3px;
  border-bottom:1px dashed transparent;border-radius:4px}
.gr-nm:hover,.gr-am:hover{background:color-mix(in srgb,var(--bar) 9%,transparent)}
.gr-nm:focus,.gr-am:focus{background:var(--surface-2);outline:1px solid var(--bar)}
.gr-del{width:20px;color:var(--faint);opacity:0;font-size:15px;line-height:1;flex:none}
.groc-row:hover .gr-del{opacity:1}
.gr-del:hover{color:var(--neg)}
.groc-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}
.groc-tools .ghost{padding:5px 12px;font-size:12px}
.groc-pull{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;
  font-size:12px;color:var(--muted);cursor:pointer;max-width:220px}
.groc-pick .k{font-size:10.5px;letter-spacing:.07em;color:var(--muted);font-weight:500;margin-bottom:7px}
.groc-list{display:flex;gap:7px;flex-wrap:wrap}
.groc-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  border-radius:20px;padding:4px 11px;font-size:12px;color:var(--muted);background:var(--surface)}
.groc-chip .tick{font-size:10px;width:11px;color:var(--faint)}
.groc-chip .am{font-size:11px;color:var(--faint)}
.groc-chip:hover{border-color:var(--bar);color:var(--ink-2)}
.groc-chip.on{background:var(--bar-soft);border-color:color-mix(in srgb,var(--bar) 40%,transparent);
  color:var(--bar);font-weight:600}
.groc-chip.on .tick,.groc-chip.on .am{color:var(--bar)}
.groc-empty{font-size:12px;color:var(--faint);padding:6px 0}

/* ---- ledger ---- */
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:900px){.ledger{grid-template-columns:1fr}}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden}
.person[data-p="0"]{border-top:3px solid var(--pA)}
.person[data-p="1"]{border-top:3px solid var(--pB)}
.p-head{display:flex;align-items:center;gap:10px;padding:13px 16px 11px}
.p-head h2{font-size:16px;letter-spacing:-.01em}
.p-head .chip{width:9px;height:9px;border-radius:2px}
.person[data-p="0"] .chip{background:var(--pA)}
.person[data-p="1"] .chip{background:var(--pB)}
.p-head .inc{margin-left:auto;text-align:right}
.p-head .inc .k{font-size:10.5px;letter-spacing:.08em;color:var(--muted)}
.p-head .inc .v{font-size:16px;font-weight:600;letter-spacing:-.01em}

.grp{border-top:1px solid var(--line-soft);padding:11px 16px 13px}
.grp-h{display:flex;align-items:center;gap:7px;margin-bottom:6px;cursor:pointer;
  border-radius:6px;padding:2px 4px;margin-left:-4px;margin-right:-4px}
.grp-h:hover{background:var(--surface-2)}
.twist{font-size:9px;color:var(--faint);line-height:1;width:11px;flex:none}
.grp.folded{padding-bottom:9px}
.grp-h h3{font-size:11.5px;letter-spacing:.09em;color:var(--muted);font-weight:600}
.grp-h .gs{margin-left:auto;font-size:12.5px;color:var(--ink-2);font-weight:600}
.rows{list-style:none;margin:0;padding:0}

.grip{flex:none;width:12px;cursor:grab;color:var(--faint);opacity:0;font-size:11px;line-height:1;
  user-select:none;letter-spacing:-1px}
.grip:active{cursor:grabbing}
.row:hover .grip,.krow:hover .grip,.groc-row:hover .grip{opacity:.55}
.grip:hover{opacity:1!important;color:var(--accent)}
.dragging{opacity:.4}
.drop-above{box-shadow:inset 0 2px 0 var(--accent)}
.drop-below{box-shadow:inset 0 -2px 0 var(--accent)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:3px 0;position:relative}
.row+.row{border-top:1px solid transparent}
.row:hover{background:var(--surface-2);border-radius:6px;margin:0 -6px;padding-left:6px;padding-right:6px}
.chk{width:17px;height:17px;flex:none;border:1.5px solid var(--line);border-radius:4px;
  position:relative;font-size:0;padding:0}

/* 이 페이지는 서버 없이 동작한다. 데이터는 이 브라우저(localStorage)에 저장되고,
   백업·이사는 헤더의 "파일로 저장" / "불러오기" 로 한다. */
const LS_KEY='gagebu.v1';
let lsOK=true;
function localDB(){
  let store=null;
  try{ store = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ store=null; }
  if(!store || typeof store!=='object' || !Object.keys(store).length) store=seedStore();
  const subs={};
  const persist=()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); lsOK=true; return true; }
                      catch(e){ lsOK=false; return false; } };
  const snap=path=>({ id:path.split('/').pop(), exists:store[path]!==undefined,
                      data:()=>store[path], metadata:{fromCache:false,hasPendingWrites:false} });
  persist();
  return {
    _store:store, _persist:persist,
    doc(path){ return {
      path, id:path.split('/').pop(),
      get(){ return Promise.resolve(snap(path)); },
      delete(){ delete store[path]; persist(); return Promise.resolve(); },
      set(d){ store[path]=JSON.parse(JSON.stringify(d));
              return persist()? Promise.resolve()
                              : Promise.reject({code:'storage_full',message:'브라우저 저장 공간이 가득 찼습니다'}); },
      onSnapshot(next){ (subs[path]=subs[path]||[]).push(next);
                        setTimeout(()=>next(snap(path)),0);
                        return ()=>{ subs[path]=(subs[path]||[]).filter(f=>f!==next); }; }
    };},
    collection(pth){ const pre=pth+'/', depth=pth.split('/').length+1;
      return { get(){ const docs=Object.keys(store)
            .filter(k=>k.indexOf(pre)===0 && k.split('/').length===depth).sort().map(snap);
          return Promise.resolve({docs, size:docs.length, empty:!docs.length}); } }; }
  };
}

function exportName(){ const d=new Date();
  return '가계부-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json'; }
async function exportData(){
  const out={version:1, exportedAt:new Date().toISOString(), months:{}, assets:null};
  const store = DB && DB.dump ? await DB.dump() : (DB && DB._store) || {};
  Object.keys(store).forEach(k=>{
    if(k.indexOf('months/')===0) out.months[k.slice(7)]=store[k];
    else if(k==='assets/main') out.assets=store[k];
  });
  return JSON.stringify(out,null,1);
}
async function saveToFile(){
  const text=await exportData(), name=exportName();
  if(window.showSaveFilePicker){
    try{
      const h=await window.showSaveFilePicker({suggestedName:name,
        types:[{description:'가계부 데이터', accept:{'application/json':['.json']}}]});
      const w=await h.createWritable(); await w.write(text); await w.close();
      setStatus('saved','파일로 저장됨'); return;
    }catch(e){ if(e && e.name==='AbortError') return; }   // 취소는 실패가 아니다
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  setStatus('saved','내려받음');
}
function loadFromFile(file){
  const fr=new FileReader();
  fr.onerror=()=>notice('파일을 읽지 못했습니다.');
  fr.onload=()=>{
    let d;
    try{ d=JSON.parse(fr.result); }catch(e){ notice('JSON 형식이 아닙니다. 내보내기로 만든 파일을 골라주세요.'); return; }
    if(!d || typeof d!=='object' || !d.months || !Object.keys(d.months).length){
      notice('가계부 데이터가 아닙니다. months 항목이 없습니다.'); return; }
    (async ()=>{
      try{
        if(DB && DB._store){
          const st=DB._store;
          Object.keys(st).forEach(k=>delete st[k]);
          Object.keys(d.months).forEach(k=> st['months/'+k]=d.months[k]);
          st['assets/main'] = d.assets || {rows:[]};
          if(!DB._persist()){ notice('불러왔지만 브라우저에 저장하지 못했습니다.'); return; }
        }else{
          for(const k of Object.keys(d.months)) await DB.doc('months/'+k).set(d.months[k]);
          await DB.doc('assets/main').set(d.assets || {rows:[]});
        }
        location.reload();
      }catch(e){ notice('불러오지 못했습니다 — '+(e && e.message || e)); }
    })();
  };
  fr.readAsText(file);
}

/* ===== 로그인 · 서버 저장 =====
   설정이 없으면(FIREBASE_CONFIG === null) 지금까지처럼 브라우저에만 저장한다. */
const CLOUD_ON = !!(window.FIREBASE_CONFIG && window.firebase);
let fbAuth=null, fbStore=null, USER=null, HID=null, HOUSE=null;

function cloudDB(hid){
  const root='households/'+hid+'/';
  const clean=o=>JSON.parse(JSON.stringify(o));   // undefined 가 섞이면 Firestore 가 거부한다
  return {
    kind:'cloud',
    doc(path){
      const ref=fbStore.doc(root+path);
      return { path, id:ref.id,
        get(){ return ref.get(); },
        set(d){ return ref.set(clean(d)); },
        delete(){ return ref.delete(); },
        onSnapshot(next,err){ return ref.onSnapshot(next,err); } };
    },
    collection(pth){
      const ref=fbStore.collection(root+pth);
      return { get(){ return ref.get(); } };
    },
    async dump(){
      const out={};
      const ms=await fbStore.collection(root+'months').get();
      ms.docs.forEach(d=> out['months/'+d.id]=d.data());
      const a=await fbStore.doc(root+'assets/main').get();
      if(a.exists) out['assets/main']=a.data();
      return out;
    }
  };
}

  let c=''; for(let i=0;i<6;i++) c+=A[Math.floor(Math.random()*A.length)];

}
async function ensureHousehold(user){
  const uref=fbStore.doc('users/'+user.uid);
  const me=await uref.get();
  let hid = me.exists ? me.data().household : null;
  if(hid){
    const h=await fbStore.doc('households/'+hid).get();
    if(h.exists && (h.data().members||[]).indexOf(user.uid)>=0){ HOUSE=h.data(); return hid; }
    hid=null;
  }
  const ref=fbStore.collection('households').doc();
  await ref.set({name:'우리 가계부', members:[user.uid]});
  await uref.set({household:ref.id, email:user.email||'', name:user.displayName||''}, {merge:true});
  HOUSE={name:'우리 가계부', members:[user.uid]};
  return ref.id;
}
async function inviteCode(){
  if(!HID) return null;
  const q=await fbStore.doc('households/'+HID).get();
  const cur=(q.data()||{}).invite;
  if(cur){
    const iv=await fbStore.doc('invites/'+cur).get();
    if(iv.exists) return cur;
  }
  const code=newCode();
  await fbStore.doc('invites/'+code).set({hid:HID});
  await fbStore.doc('households/'+HID).update({invite:code});
  return code;
}
async function joinByCode(code){
  code=String(code||'').trim().toUpperCase();
  if(code.length!==6) throw new Error('코드는 6글자입니다.');
  const iv=await fbStore.doc('invites/'+code).get();
  if(!iv.exists) throw new Error('그런 코드가 없습니다. 다시 확인해 주세요.');
  const hid=iv.data().hid;
  /* 아직 구성원이 아니라 가구 문서를 미리 읽을 수 없다.
     읽지 않고 자기 uid 만 덧붙이도록 arrayUnion 을 쓴다. */
  try{
    await fbStore.doc('households/'+hid).update({
      members: firebase.firestore.FieldValue.arrayUnion(USER.uid)
    });
  }catch(e){
    if(e && e.code==='permission-denied')
      throw new Error('참여가 거절되었습니다. 코드가 만료되었거나 이미 다른 가계부에 속해 있습니다.');
    throw e;
  }
  await fbStore.doc('users/'+USER.uid).set(
    {household:hid, email:USER.email||'', name:USER.displayName||''}, {merge:true});
  return hid;
}

/* ---------- math ---------- */
/* 두 가지를 구분한다.
   EXCL  : 카드 결제액에서도 빠진다 ('제외'만)
   OFF   : 사람별 지출 합계에서 빠진다 ('비빅'은 비상금에서 나가므로 월급 지출이 아니다) */
const EXCL = f => f==='exclude';
const OFF  = f => f==='exclude' || f==='bibik';
// 총지출에서 빠지는 금액. 상위 항목에 표시가 있으면 그 항목 전체가 빠지고, 없으면 표시된 하위 내역만 빠진다.
function itemAdjust(it){
  if(OFF(it.flag)) return num(it.amount);
  if(isSum(it)) return kidsFlagged(it,'bibik');   // 제외분은 이미 카드값에서 빠졌다
  return (it.children||[]).reduce((a,c)=> a + (OFF(c.flag) ? num(c.amount) : 0), 0);
}
/* 화면에 보여줄 "빠진 돈" — 합산 모드는 항목 금액에서 이미 빠졌으므로 따로 세어준다 */
function itemRemoved(it){        // 화면에 보여줄 "빠진 돈" 합계
  if(OFF(it.flag)) return num(it.amount);
  if(isSum(it)) return kidsFlagged(it,'bibik') + kidsFlagged(it,'exclude');
  return (it.children||[]).reduce((a,c)=> a + (OFF(c.flag) ? num(c.amount) : 0), 0);
}
function itemBibik(it){          // 집계용 — 총지출에는 영향을 주지 않는다
  if(it.flag==='bibik')  return num(it.amount);
  if(it.flag==='exclude') return 0;
  return (it.children||[]).reduce((a,c)=> a + (c.flag==='bibik' ? num(c.amount) : 0), 0);
}
function kidsTotal(it){ return (it.children||[]).reduce((a,k)=>a+num(k.amount),0); }
/* 청구서 전체(=카드사가 긁은 돈) 중 월급에서 나가는 몫만 항목 금액이 된다 */
function kidsSalary(it){ return (it.children||[]).reduce((a,k)=>a+(EXCL(k.flag)?0:num(k.amount)),0); }
function kidsFlagged(it,f){ return (it.children||[]).reduce((a,k)=>a+(k.flag===f?num(k.amount):0),0); }
function isSum(it){ return it.sum===true && (it.children||[]).length>0; }
/* 합산 모드 항목은 하위 내역 합계가 곧 결제액이 된다 */
function syncSums(m){
  if(!m) return;
  (m.people||[]).forEach(p=>(p.sections||[]).forEach(s=>(s.items||[]).forEach(it=>{
    if(isSum(it)) it.amount = kidsSalary(it);
  })));
}
function calc(m){
  if(!m) return null;
  syncSums(m);
  const per = (m.people||[]).map(p=>{
    const income = (p.income||[]).reduce((a,i)=>a+num(i.amount),0);
    const secs = {}; let gross=0, adj=0, removed=0;
    (p.sections||[]).forEach(s=>{
      const sum = (s.items||[]).reduce((a,i)=>a+num(i.amount),0);
      secs[s.key]=sum; gross+=sum;
      adj += (s.items||[]).reduce((a,i)=>a+itemAdjust(i),0);
      removed += (s.items||[]).reduce((a,i)=>a+itemRemoved(i),0);
    });
    const spend = gross-adj;
    return {income, gross, adj, removed, spend, secs, net: income-spend};
  });
  const bibik = (m.people||[]).reduce((a,p)=> a + (p.sections||[]).reduce((b,s)=>
      b + (s.items||[]).reduce((c,i)=> c + itemBibik(i),0),0),0);
  const totalIn = per.reduce((a,x)=>a+x.income,0);
  const totalOut = per.reduce((a,x)=>a+x.spend,0);
  const savings = per.reduce((a,x)=>a+(x.secs.savings||0),0);
  const left = totalIn-totalOut;
  const account = num(m.bibikAccount!=null ? m.bibikAccount : m.bibikBalance);
  return {per,totalIn,totalOut,savings,bibik,left,
          account, rest: account-bibik, carry: account-bibik+left};
}

/* ===== 실행취소 / 다시실행 =====
   바뀌기 직전 상태를 통째로 쌓아 둔다. 같은 칸에 연달아 타자를 치면
   한 단계로 묶어서, Ctrl+Z 한 번에 글자 하나씩 지워지지 않게 한다. */
const UNDO_MAX = 60, COALESCE_MS = 900;
let undoStack=[], redoStack=[], committed=null, lastTag=null, lastTime=0, tagSeq=0;

function stateNow(){
  return { mkey:MKEY, months:MONTHS.slice(),
           month: MONTH? clone(MONTH):null, assets: ASSETS? clone(ASSETS):null };
}
function autoTag(){                      // 같은 입력칸에서의 연속 타자를 한 덩어리로
  const a=document.activeElement;
  if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA')){
    if(!a._utag) a._utag='f'+(++tagSeq);
    return a._utag;
  }
  return null;                           // 버튼·구조 변경은 언제나 별도 단계
}
function pushUndo(){
  const tag=autoTag(), now=Date.now();
  const same = tag!=null && tag===lastTag && (now-lastTime)<COALESCE_MS;
  if(!same && committed){
    undoStack.push(committed);
    if(undoStack.length>UNDO_MAX) undoStack.shift();
    redoStack.length=0;
  }
  if(!same) lastTag=tag;
  lastTime=now;
  committed=stateNow();
  paintUndo();
}
function applyState(st){
  MONTHS=st.months.slice(); MKEY=st.mkey;
  if(st.assets) ASSETS=clone(st.assets);
  if(st.month)  MONTH=clone(st.month);
  if(DB){
    const keep=new Set(st.months);       // 되살리거나, 되돌린 뒤 남는 달은 지운다
    Object.keys(DB._store||{}).forEach(k=>{
      if(k.indexOf('months/')===0 && !keep.has(k.slice(7))) DB.doc(k).delete();
    });
    if(st.month) DB.doc('months/'+st.mkey).set(st.month);
    if(ASSETS)   DB.doc('assets/main').set(ASSETS);
  }
  committed=stateNow(); lastTag=null;
  renderMonthBar(); renderSummary(); renderLedger(); renderAssets();
  if(DB) openMonth(st.mkey);
  paintUndo();
}
function doUndo(){
  if(!undoStack.length){ showToast('되돌릴 작업이 없습니다.'); return; }
  redoStack.push(stateNow());
  applyState(undoStack.pop());
  showToast('되돌렸습니다 · Ctrl+Shift+Z 로 다시 실행');
}
function doRedo(){
  if(!redoStack.length){ showToast('다시 실행할 작업이 없습니다.'); return; }
  undoStack.push(stateNow());
  applyState(redoStack.pop());
  showToast('다시 실행했습니다.');
}
function paintUndo(){
  const u=$('#btn-undo'), r=$('#btn-redo');
  if(!u) return;
  u.disabled=!undoStack.length; r.disabled=!redoStack.length;
  u.title='실행취소 (Ctrl+Z)'+(undoStack.length? ' · '+undoStack.length+'단계':'');
  r.title='다시 실행 (Ctrl+Shift+Z)'+(redoStack.length? ' · '+redoStack.length+'단계':'');
}
document.addEventListener('keydown', e=>{
  if(!(e.ctrlKey||e.metaKey) || e.altKey) return;
  const k=(e.key||'').toLowerCase();
  if(k==='z' && !e.shiftKey){
    const a=document.activeElement;
    if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA')){
      // 입력칸 안에서는 브라우저 기본 되돌리기를 먼저 쓰고,
      // 되돌릴 게 없으면(값이 그대로면) 앱 되돌리기로 넘긴다
      const before=a.value;
      setTimeout(()=>{ if(a.value===before) doUndo(); }, 0);
      return;
    }
    e.preventDefault(); doUndo();
  } else if((k==='z' && e.shiftKey) || k==='y'){
    e.preventDefault(); doRedo();
  }
});

/* 되돌리기 어려운 일에는 한 번 물어본다 */
function confirmDialog(o){
  return new Promise(resolve=>{
    const back=el('div','modal-back'), box=el('div','modal');
    box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true');
    box.appendChild(el('h3','modal-ttl', o.title));
    if(o.body) box.appendChild(el('p','modal-body', o.body));
    if(o.list && o.list.length){
      const ul=el('ul','modal-list');
      o.list.forEach(t=> ul.appendChild(el('li',null,t)));
      box.appendChild(ul);
    }
    const foot=el('div','modal-foot');
    const cancel=el('button','ghost','취소');
    const ok=el('button', o.danger? 'btn-danger':'btn-primary', o.ok||'확인');
    foot.appendChild(cancel); foot.appendChild(ok);
    box.appendChild(foot); back.appendChild(box);
    document.body.appendChild(back);

    const close=v=>{ back.remove(); document.removeEventListener('keydown', key, true); resolve(v); };
    const key=e=>{
      if(e.key==='Escape'){ e.preventDefault(); close(false); }
      else if(e.key==='Enter'){ e.preventDefault(); close(true); }
      else if(e.key==='Tab'){ e.preventDefault(); (document.activeElement===ok? cancel:ok).focus(); }
    };
    document.addEventListener('keydown', key, true);
    back.addEventListener('mousedown', e=>{ if(e.target===back) close(false); });
    cancel.addEventListener('click', ()=>close(false));
    ok.addEventListener('click', ()=>close(true));
    setTimeout(()=>ok.focus(), 0);
  });
}

/* 지우기 토스트 — 실행취소 스택을 그대로 쓴다 */
let toastT=null, undoFn=null;
function showToast(msg, undo){
  clearTimeout(toastT);
  $('#toast-t').textContent=msg;
  undoFn=undo||null;
  $('#toast-undo').hidden=!undoFn;
  $('#toast').hidden=false;
  toastT=setTimeout(()=>{ $('#toast').hidden=true; undoFn=null; }, undo?7000:2600);
}

/* ---------- saving ---------- */
let saveT=null, dirty={month:false,assets:false}, savePending=false;
/* 저장 대기 중에 다른 종류의 저장이 또 걸려도 앞의 것을 잃지 않도록 누적한다 */
function save(kind){
  if(!DB) return;
  pushUndo();
  if(kind!=='assets') dirty.month=true;
  if(kind!=='month')  dirty.assets=true;
  savePending=true;
  setStatus('saving','저장 중');
  clearTimeout(saveT);
  saveT = setTimeout(async()=>{
    const d=dirty; dirty={month:false,assets:false};
    try{
      if(d.month && MONTH) await DB.doc('months/'+MKEY).set(MONTH);
      if(d.assets && ASSETS) await DB.doc('assets/main').set(ASSETS);
      const t=new Date();
      setStatus('saved','저장됨 '+t.getHours()+':'+String(t.getMinutes()).padStart(2,'0'));
    }catch(e){
      dirty.month = dirty.month||d.month; dirty.assets = dirty.assets||d.assets;
      setStatus('off','저장 실패 — '+(e && e.code || ''));
    }
    savePending = dirty.month||dirty.assets;
  },450);
}
function saveBoth(){ save('both'); }

/* ---------- 메모 ----------
   칸이 좁아 긴 글이 잘리므로, 눌러서 여는 쪽지창에서 전체를 보고 고친다. */
let memoPop=null, memoOutside=null;
function closeMemo(){
  if(!memoPop) return;
  memoPop.remove(); memoPop=null;
  if(memoOutside){ document.removeEventListener('mousedown', memoOutside, true); memoOutside=null; }
}
function openMemo(anchor, get, set, label){
  closeMemo();
  const pop=el('div','memo-pop');
  pop.appendChild(el('div','mp-head', label||'메모'));
  const ta=document.createElement('textarea');
  ta.className='mp-text'; ta.rows=5; ta.value=get()||'';
  ta.placeholder='메모를 적어 두세요. 줄바꿈도 됩니다.';
  ta.addEventListener('input',()=> set(ta.value));
  ta.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.preventDefault(); closeMemo(); anchor.focus(); } });
  pop.appendChild(ta);
  const foot=el('div','mp-foot');
  foot.appendChild(el('span','mp-hint','Esc 로 닫기 · 입력하면 바로 저장됩니다'));
  const btn=el('button','mp-done','닫기');
  btn.addEventListener('click',()=>{ closeMemo(); anchor.focus(); });
  foot.appendChild(btn); pop.appendChild(foot);
  document.body.appendChild(pop);

  const r=anchor.getBoundingClientRect(), w=pop.offsetWidth||300;
  pop.style.left = Math.max(10, Math.min(r.left, window.innerWidth-w-14)) + 'px';
  const below = r.bottom + window.scrollY + 6;
  const fits = (window.innerHeight - r.bottom) > (pop.offsetHeight + 16);
  pop.style.top = (fits ? below : Math.max(10, r.top + window.scrollY - pop.offsetHeight - 6)) + 'px';

  memoPop=pop;
  memoOutside = e => { if(memoPop && !memoPop.contains(e.target) && e.target!==anchor) closeMemo(); };
  document.addEventListener('mousedown', memoOutside, true);
  setTimeout(()=>{ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 0);
}
function memoField(get, set, ph, label){
  const c=el('div','memo-cell'); c.tabIndex=0; c.setAttribute('role','button');
  const paint=()=>{ const v=(get()||'').replace(/\s+/g,' ').trim();
    c.textContent = v || (ph||'메모'); c.classList.toggle('ph', !v); c.title = v||''; };
  paint();
  const open=()=>openMemo(c, get, v=>{ set(v); paint(); }, label);
  c.addEventListener('click', open);
  c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
  return c;
}

/* ---------- 드래그로 순서 바꾸기 ----------
   손잡이(⠿)를 잡고 끌면 그 자리에 놓인다. 배열을 직접 옮기고 다시 그린다. */
let dragSrc=null;
function makeSortable(rowEl, arr, obj, after){
  rowEl.dataset.drag='1';
  rowEl.addEventListener('dragover', e=>{
    if(!dragSrc || dragSrc.arr!==arr || dragSrc.obj===obj) return;
    e.preventDefault();
    const r=rowEl.getBoundingClientRect();
    const below = (e.clientY - r.top) > r.height/2;
    rowEl.classList.toggle('drop-below', below);
    rowEl.classList.toggle('drop-above', !below);
  });
  rowEl.addEventListener('dragleave', ()=> rowEl.classList.remove('drop-above','drop-below'));
  rowEl.addEventListener('drop', e=>{
    e.preventDefault(); e.stopPropagation();
    const below = rowEl.classList.contains('drop-below');
    rowEl.classList.remove('drop-above','drop-below');
    if(!dragSrc || dragSrc.arr!==arr || dragSrc.obj===obj) return;
    const from=arr.indexOf(dragSrc.obj);
    if(from<0) return;
    arr.splice(from,1);
    let to=arr.indexOf(obj); if(to<0) to=arr.length-1;
    arr.splice(below? to+1 : to, 0, dragSrc.obj);
    dragSrc=null;
    if(after) after();
    save('month');
  });
}
function dragHandle(rowEl, arr, obj, after){
  const h=el('span','grip','⠿');
  h.title='끌어서 순서 바꾸기';
  h.setAttribute('aria-hidden','true');
  h.draggable=true;
  h.addEventListener('dragstart', e=>{
    dragSrc={arr, obj};
    rowEl.classList.add('dragging');
    if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain','row'); }catch(_){} }
  });
  h.addEventListener('dragend', ()=>{
    rowEl.classList.remove('dragging'); dragSrc=null;
    document.querySelectorAll('.drop-above,.drop-below')
            .forEach(n=>n.classList.remove('drop-above','drop-below'));
  });
  return h;
}

/* ===== 식생품 =====
   카드값에서 체크한 고정 내역을 빼서 이번 달 식생품 사용액을 본다.
   여기 숫자는 보기용이라 총수입·총지출·남은 금액에는 전혀 들어가지 않는다. */
const GROC_DEFAULT_BUDGET = 600000;
const GROC_SEED_NAMES = ['통신비','구독료'];   // 처음 한 번만 자동으로 담는다
function grocCfg(){
  if(!MONTH) return null;
  if(!MONTH.grocery) MONTH.grocery = {base:'', card:0, budget:GROC_DEFAULT_BUDGET, deduct:[]};
  const g=MONTH.grocery;
  if(!Array.isArray(g.deduct)) g.deduct=[];
  if(!Array.isArray(g.on)) g.on=[];        // 실제로 결제되어 차감에 넣은 내역
  if(g.budget==null) g.budget=GROC_DEFAULT_BUDGET;
  if(g.card==null) g.card=0;
  return g;
}
function grocCandidates(){
  const out=[];
  ((MONTH&&MONTH.people)||[]).forEach(p=>(p.sections||[]).forEach(sec=>(sec.items||[]).forEach(it=>{
    if((it.children||[]).length) out.push({person:p.name, item:it});
  })));
  return out;
}
function grocBase(){
  const g=grocCfg(); if(!g||!g.base) return null;
  return grocCandidates().find(c=>c.item.id===g.base) || null;
}
/* 차감 목록에 담긴 항목들 — 신한카드 세부 내역을 그대로 가리킨다 */
function grocItems(){
  const g=grocCfg(), b=grocBase();
  if(!g||!b) return [];
  const kids=b.item.children||[];
  g.deduct = g.deduct.filter(id => kids.some(k=>k.id===id));   // 지워진 내역은 정리
  g.on = g.on.filter(id => g.deduct.indexOf(id)>=0);
  return g.deduct.map(id => kids.find(k=>k.id===id));
}
function grocCalc(){
  const g=grocCfg(), b=grocBase();
  if(!g||!b) return null;
  const picked=grocItems();
  const onSet=g.on;
  const applied=picked.filter(k=>onSet.indexOf(k.id)>=0);   // 체크한 것만 실제로 뺀다
  const cut=applied.reduce((a,k)=>a+num(k.amount),0);
  const card=num(g.card), used=card-cut, budget=num(g.budget), left=budget-used;
  return {card, cut, used, budget, left, picked, applied, item:b.item, person:b.person,
          pct: budget? Math.min(200, used/budget*100) : 0};
}
/* 패널에서 고친 값이 가계부 줄에도 바로 보이게 한다 (양방향 연동) */
function syncKidRow(k){
  const li=Array.from(document.querySelectorAll('#ledger li')).find(n=>n._kid===k);
  if(!li) return;
  const nm=li.querySelector('input.nm'), am=li.querySelector('input.amt');
  if(nm && document.activeElement!==nm) nm.value=k.name||'';
  if(am && document.activeElement!==am) am.value = num(k.amount)? NF.format(num(k.amount)):'';
}

function grocNumField(val, onSet, cls){

  i.value = num(val)? NF.format(num(val)) : '';
  i.addEventListener('focus',()=>{ i.value = num(i.value)? String(num(i.value)) : ''; i.select(); });
  i.addEventListener('blur',()=>{ const n=num(i.value); i.value = n? NF.format(n):''; });
  i.addEventListener('input',()=> onSet(num(i.value)));
  return i;
}

function renderGrocery(){

  updateGrocery();

/* 패널의 ＋ 내역 추가 — 카드 세부 내역에도 같은 줄이 생긴다 */
function addGrocItem(){
  const g=grocCfg(), b=grocBase();
  if(!b){ showToast('먼저 연동할 카드를 골라주세요.'); return; }
  const k={id:uid(), name:'', amount:0, note:'', flag:''};
  b.item.children = b.item.children || [];
  b.item.children.push(k);
  g.deduct.push(k.id);
  b.item.open = true;
  renderLedger(); renderGrocery(); save('month');
  requestAnimationFrame(()=>{
    const rows=document.querySelectorAll('#grocery .groc-row input.gr-nm');
    const last=rows[rows.length-1]; if(last) last.focus();
  });
}
function recalcQuiet(){          // 가계부 합계만 갱신 (패널을 다시 그리지 않는다)

    const c=calc(MONTH); const t=$('#summary').children;
    if(t[0]){ const v=t[0].querySelector('.v'); v.textContent=wonp(c.left); v.className='v num '+(c.left<0?'neg':'pos'); }

function recalc(){
  refreshSummaryOnly();
  if(document.activeElement && document.activeElement.closest &&
     document.activeElement.closest('#grocery')) updateGrocery();
  else renderGrocery();
  const c=calc(MONTH); if(!c) return;
  document.querySelectorAll('.person').forEach((pn,pi)=>{
    pn.querySelectorAll('li').forEach(li=>{
      const it=li._item; if(!it||!li._amt) return;
      if(isSum(it) && document.activeElement!==li._amt){
        // syncSums 가 이미 월급분으로 맞춰 둔 값을 쓴다 (청구액 전체가 아니다)
        const t=num(it.amount); li._amt.value = t? NF.format(t):'';
      }
    });
    const p=c.per[pi]; if(!p) return;
    const iv=pn.querySelector('.inc .v'); if(iv) iv.textContent=won(p.income);
    pn.querySelectorAll('.grp').forEach((g)=>{
      const key=g.dataset.k; const s=g.querySelector('.gs'); if(s) s.textContent=won(p.secs[key]||0);
    });
    const ar=pn.querySelector('.f-adjrow');
    ar.hidden = !p.removed;
    if(p.removed) pn.querySelector('.f-adj').textContent='−'+won(p.removed);
    pn.querySelector('.f-spend').textContent=won(p.spend);
    const nv=pn.querySelector('.f-net'); nv.textContent=wonp(p.net); nv.style.color=p.net<0?'var(--neg)':'var(--pos)';
    pn.querySelectorAll('.kfoot').forEach(kf=>{
      const li=kf.closest('li'); const it=li && li._item; if(!it) return;
      const s=kidsTotal(it); const g=kf.querySelector('.gap');
      if(isSum(it)){
        const bib=kidsFlagged(it,'bibik'), exc=kidsFlagged(it,'exclude');
        kf.querySelector('.ks').textContent = exc
          ? '청구액 '+won(s)+' 중 결제액 '+won(s-exc)
          : (it.children||[]).length+'건 합계 '+won(s)+' = 청구액';
        g.textContent = [exc?'제외 '+won(exc):'',
                         bib?'비빅 '+won(bib)+' (비상금에서)':''].filter(Boolean).join(' · ');
      }else{
        kf.querySelector('.ks').textContent='하위 합계 '+won(s);
        const gap=num(it.amount)-s;
        g.textContent = gap? (gap>0? '남음 '+won(gap) : '초과 '+won(-gap)) : '';
      }
    });
    pn.querySelectorAll('.spend-meter').forEach(mt=>{
      const li=mt.closest('li'); const it=li && li._item; if(!it) return;
      mt.hidden = isSum(it);
      mt.querySelector('i').style.width=Math.min(100, num(it.amount)? kidsTotal(it)/num(it.amount)*100:0)+'%';
    });
  });
}

/* 저축 항목을 자산 계좌에 연결한다. 체크 = 그 달 납입분을 계좌 잔액에 반영.
   반영한 금액을 item.appliedAmount 에 기억해 두어 이중 가산과 되돌리기 오류를 막는다. */
function assetRow(id){ return (ASSETS && ASSETS.rows || []).find(r=>r.id===id) || null; }
function assetDelta(id, d){
  const row=assetRow(id); if(!row||!d) return false;
  row.amount = num(row.amount) + d; return true;
}
function setApplied(it, on){
  if(!it.link || !ASSETS) { it.applied = false; it.appliedAmount = 0; return false; }
  let moved=false;
  if(on && !it.applied){ moved = assetDelta(it.link, num(it.amount)); if(moved){ it.applied=true; it.appliedAmount=num(it.amount); } }
  else if(!on && it.applied){ moved = assetDelta(it.link, -num(it.appliedAmount||it.amount)); it.applied=false; it.appliedAmount=0; }
  return moved;
}
function syncAppliedAmount(it){ // 반영된 상태에서 금액을 고치면 차액만큼 계좌도 따라간다
  if(!it.applied || !it.link) return false;
  const d = num(it.amount) - num(it.appliedAmount);
  if(!d) return false;
  const moved = assetDelta(it.link, d);
  if(moved) it.appliedAmount = num(it.amount);
  return moved;
}
function relink(it, newId){ // 연결 계좌를 바꾸면 이전 계좌에서 빼고 새 계좌에 더한다
  const wasApplied = it.applied;
  if(wasApplied) setApplied(it,false);
  it.link = newId || '';
  if(wasApplied && it.link) setApplied(it,true);
}
function appliedTotal(){
  let t=0;
  ((MONTH&&MONTH.people)||[]).forEach(p=>(p.sections||[]).forEach(s=>(s.items||[]).forEach(it=>{
    if(it.applied) t += num(it.appliedAmount);
  })));
  return t;
}

/* ---------- assets view ---------- */
const GROUPS = [{key:'main',   title:'우리 총자산', desc:'예·적금과 보증금 — 만기와 금리로 본다'},
                {key:'retire', title:'노후 자금',   desc:'증권·보험 — 원금 대비 평가손익으로 본다'}];
/* 시트의 "노후 자금" 탭에 있던 계좌들 */
const RETIRE_IDS = [];   // 노후 자금으로 자동 분류할 계좌 id
function migrateAssets(a){
  var changed=false;
  ((a&&a.rows)||[]).forEach(function(r){
    if(r.group!=='main' && r.group!=='retire'){
      r.group = RETIRE_IDS.indexOf(r.id)>=0 ? 'retire' : 'main'; changed=true;
    }
    if(r.principal===undefined){        // 메모에 적혀 있던 "원금 291,480" 을 칸으로 빼낸다
      var m = String(r.memo||'').match(/원금[:\s]*([0-9,]+)/);
      r.principal = m ? num(m[1]) : 0;
      if(m) r.memo = String(r.memo).replace(m[0],'').replace(/^[\s.,]+|[\s.,]+$/g,'');
      changed=true;
    }
  });
  return changed;
}
/* 평가손익은 원금이 적힌 계좌끼리만 비교한다.
   원금 없는 계좌(보험·통장)를 섞으면 잔액 전체가 이익으로 잡힌다. */
function plOf(rows){
  const w=(rows||[]).filter(r=>num(r.principal)>0);
  const principal=w.reduce((a,r)=>a+num(r.principal),0);
  const current=w.reduce((a,r)=>a+num(r.amount),0);
  return {n:w.length, principal, current, gain:current-principal};
}
function groupRows(g){ return allRows().filter(function(r){ return r.group===g; }); }

/* 묶음마다 따로 거른다 */
const FILTERS = { main:  {owner:'',type:'',bank:'',sort:'owner'},
                  retire:{owner:'',type:'',bank:'',sort:'owner'} };
const SORTS = [['owner','관리자순'],['type','구분순'],['bank','기관순'],
               ['','입력 순서'],['amount','금액 많은 순'],['maturity','만기 임박순']];

function allRows(){ return (ASSETS && ASSETS.rows) || []; }
function filterActive(g){ const F=FILTERS[g]; return !!(F.owner||F.type||F.bank); }
function visibleRows(g){
  const F=FILTERS[g];
  let rows = groupRows(g).filter(r=>
    (!F.owner || r.owner===F.owner) &&
    (!F.type  || r.type===F.type) &&
    (!F.bank  || r.bank===F.bank));
  const amt = r=>num(r.amount);
  const day = r=>{ const m=String(r.maturity||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
                   return m? new Date(+m[1],+m[2]-1,+m[3]).getTime() : Infinity; };
  const cmp = {
    owner:(a,b)=> (OWNERS.indexOf(a.owner)-OWNERS.indexOf(b.owner)) || amt(b)-amt(a),
    type: (a,b)=> (ATYPES.indexOf(a.type)-ATYPES.indexOf(b.type)) || amt(b)-amt(a),
    bank: (a,b)=> String(a.bank||'').localeCompare(String(b.bank||''),'ko') || amt(b)-amt(a),
    amount:(a,b)=> amt(b)-amt(a),
    maturity:(a,b)=> day(a)-day(b),
  }[F.sort];
  return cmp ? rows.slice().sort(cmp) : rows;
}
function assetCalc(rows){
  rows = rows || allRows();
  const now = rows.reduce((a,r)=>a+num(r.amount),0);
  const exp = rows.reduce((a,r)=>a+num(r.expected||r.amount),0);
  const byOwner={}, byType={}, byBank={};
  rows.forEach(r=>{
    byOwner[r.owner||'미지정']=(byOwner[r.owner||'미지정']||0)+num(r.amount);
    byType[r.type||'기타']=(byType[r.type||'기타']||0)+num(r.amount);
    byBank[r.bank||'기타']=(byBank[r.bank||'기타']||0)+num(r.amount);
  });
  return {rows,now,exp,byOwner,byType,byBank};
}
function monthsLeft(d){
  if(!d) return null;
  const m=String(d).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); if(!m) return null;
  return Math.ceil((new Date(+m[1],+m[2]-1,+m[3]) - new Date())/86400000);
}

function filterBar(g){
  const F=FILTERS[g], rows=groupRows(g);
  const bar=el('div','filters');
  const uniq = f => Array.from(new Set(rows.map(r=>r[f]).filter(Boolean)));
  const mk=(key,label,opts)=>{
    const sel=el('select'); sel.setAttribute('aria-label',label);
    const o0=el('option',null,label); o0.value=''; sel.appendChild(o0);
    opts.forEach(v=>{ const o=el('option',null,v); o.value=v; if(v===F[key])o.selected=true; sel.appendChild(o); });
    sel.classList.toggle('on', !!F[key]);
    sel.addEventListener('change',()=>{ F[key]=sel.value; renderAssets(); });
    bar.appendChild(sel);
  };
  mk('owner','관리자 전체', uniq('owner'));
  mk('type','구분 전체', ATYPES.filter(t=>rows.some(r=>r.type===t)));
  mk('bank', g==='retire'?'기관 전체':'은행 전체', uniq('bank'));
  const ss=el('select'); ss.setAttribute('aria-label','정렬');
  SORTS.filter(([v])=> g!=='retire' || v!=='maturity').forEach(([v,t])=>{
    const o=el('option',null,t); o.value=v; if(v===F.sort)o.selected=true; ss.appendChild(o); });
  ss.classList.toggle('on', F.sort!=='owner');
  ss.addEventListener('change',()=>{ F.sort=ss.value; renderAssets(); });
  bar.appendChild(ss);
  if(filterActive(g) || F.sort!=='owner'){
    const rb=el('button','ghost','초기화');
    rb.addEventListener('click',()=>{ F.owner=F.type=F.bank=''; F.sort='owner'; renderAssets(); });
    bar.appendChild(rb);
  }
  const n=visibleRows(g).length;
  bar.appendChild(el('span','fcount', filterActive(g)? n+' / '+rows.length+'개 계좌' : rows.length+'개 계좌'));
  return bar;
}

function assetCell(row, kind){
  const td=el('td');
  if(kind==='owner'){
    const sel=el('select','f');
    OWNERS.concat(row.owner && OWNERS.indexOf(row.owner)<0?[row.owner]:[]).forEach(o=>{
      const op=el('option',null,o); op.value=o; if(o===row.owner)op.selected=true; sel.appendChild(op); });
    sel.addEventListener('change',()=>{row.owner=sel.value; renderAssets(); save('assets');});
    const pill=el('span','owner-pill'), dot=el('i');
    dot.style.background = row.owner===OWNERS[1]?'var(--pB)': row.owner===OWNERS[2]?'var(--bar)':'var(--pA)';
    pill.appendChild(dot); pill.appendChild(sel); td.appendChild(pill);
  }
  else if(kind==='type' || kind==='bank'){
    const opts = kind==='type'? ATYPES : BANKS, cur=row[kind];
    const sel=el('select', kind==='type'? 'f chip-sel' : 'f');
    if(kind==='type') sel.dataset.v = cur||'';
    opts.concat(cur && opts.indexOf(cur)<0?[cur]:[]).forEach(o=>{
      const op=el('option',null,o); op.value=o; if(o===cur)op.selected=true; sel.appendChild(op); });
    sel.addEventListener('change',()=>{row[kind]=sel.value; renderAssets(); save('assets');});
    td.appendChild(sel);
  }
  else if(kind==='name') td.appendChild(textField('', row.name, v=>{row.name=v;save('assets');}, '항목'));
  else if(kind==='memo') td.appendChild(memoField(()=>row.memo, v=>{row.memo=v;save('assets');},
                                        '메모', (row.name||'계좌')+' 메모'));
  else if(kind==='rate'){ td.className='r'; td.appendChild(textField('', row.rate, v=>{row.rate=v;save('assets');}, '0%')); }
  else if(kind==='amount'||kind==='expected'||kind==='principal'){
    td.className='r';
    td.appendChild(amtField('', num(row[kind]), v=>{row[kind]=v;save('assets');renderAssetsSoon();}));
  }
  else if(kind==='maturity'){
    const w=el('div'); w.style.cssText='display:flex;align-items:center;gap:6px';
    w.appendChild(textField('', row.maturity, v=>{row.maturity=v;save('assets');}, '2027. 1. 1'));
    const days=monthsLeft(row.maturity);
    if(days!=null){
      const cls = days<0?' over': days<=90?' soon':'';
      const b=el('span','dday'+cls, days<0?'만기 지남': days===0?'오늘 만기':'D-'+days);
      if(days<0) b.title='만기일이 지났습니다 — 실제 잔액을 확인해 주세요';
      w.appendChild(b);
    }
    td.appendChild(w);
  }
  else if(kind==='pl'){
    td.className='r num';
    const pr=num(row.principal), gain=num(row.amount)-pr;
    if(!pr){ td.textContent='—'; td.style.color='var(--faint)'; }
    else{
      td.textContent=(gain>=0?'+':'')+won(gain);
      td.style.color = gain>=0? 'var(--pos)':'var(--neg)';
      td.title='원금 대비 '+(gain>=0?'+':'')+(gain/pr*100).toFixed(1)+'%';
    }
  }
  return td;
}

  const lines=[ items+'개 항목과 세부 내역 '+kids+'건',
                '수입 '+won(c0.totalIn)+' · 지출 '+won(c0.totalOut)+' 기록' ];
  if(applied) lines.push('자산에 반영해 둔 저축 '+applied+'건이 계좌에서 되돌려집니다');
  const ok = await confirmDialog({
    title: label+' 가계부를 지울까요?',
    body: '이 달에 적어 둔 내용이 모두 사라집니다.',
    list: lines,
    ok: '이 달 지우기', danger: true
  });
  if(!ok) return;
  // 이 달에서 자산에 반영해 둔 저축분을 먼저 되돌린다
  (MONTH.people||[]).forEach(p=>(p.sections||[]).forEach(s=>(s.items||[]).forEach(it=>{
    if(it.applied) setApplied(it,false); })));
  DB.doc('months/'+key).delete();
  MONTHS=MONTHS.filter(k=>k!==key);
  renderAssets(); save('assets');
  openMonth(MONTHS[MONTHS.length-1]);
  showToast(key.slice(0,4)+'.'+key.slice(5)+' 삭제됨', doUndo);
});

function openMonth(key){
  MKEY=key;
  renderMonthBar();
  if(unsubM){unsubM();unsubM=null;}
  if(!DB) return;
  unsubM = DB.doc('months/'+key).onSnapshot(snap=>{
    if(!snap.exists){ MONTH=emptyMonth(key); renderSummary(); renderLedger(); return; }
    if(snap.metadata.hasPendingWrites || savePending) return;
    const d=snap.data();
    if(JSON.stringify(d)===JSON.stringify(MONTH)) return;
    if(isEditing()){ PEND.month=d; return; }
    MONTH=clone(d); renderSummary(); renderLedger(); renderGrocery(); showDemoNotice();
  }, e=>setStatus('off','동기화 끊김 ('+e.code+')'));
}
document.addEventListener('focusout',()=>{
  setTimeout(()=>{
    if(isEditing()) return;
    if(PEND.month){ MONTH=clone(PEND.month); PEND.month=null; renderSummary(); renderLedger(); }
    if(PEND.assets){ ASSETS=clone(PEND.assets); PEND.assets=null; renderAssets(); }
  },40);
});

$('#toast-undo').addEventListener('click',()=>{
  const f=undoFn; undoFn=null; clearTimeout(toastT); $('#toast').hidden=true; if(f) f();
});
$('#btn-export').addEventListener('click',saveToFile);
$('#file-import').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) loadFromFile(f); e.target.value=''; });

/* 테마 — 시스템 / 밝게 / 어둡게 */
const THEMES=['auto','light','dark'];
const THEME_LABEL={auto:'시스템 설정',light:'밝게',dark:'어둡게'};
let theme='auto';
try{ theme = localStorage.getItem('gagebu.theme') || 'auto'; }catch(e){}
function applyTheme(){
  if(theme==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  const b=$('#btn-theme');
  b.textContent = theme==='auto'?'◐': theme==='light'?'☀':'☾';
  b.title='테마: '+THEME_LABEL[theme]+' (눌러서 전환)';
}
$('#btn-theme').addEventListener('click',()=>{
  theme = THEMES[(THEMES.indexOf(theme)+1) % THEMES.length];
  try{ localStorage.setItem('gagebu.theme', theme); }catch(e){}
  applyTheme(); renderAssets();
  showToast('테마: '+THEME_LABEL[theme]);
});
applyTheme();

/* 요약이 화면 밖으로 나가면 헤더에 축약해 띄운다 */
function updateMini(){
  const c = MONTH ? calc(MONTH) : null;
  const m=$('#mini');
  if(!c){ m.innerHTML=''; return; }
  m.innerHTML='';
  m.appendChild(el('span', null, (MKEY? MKEY.slice(0,4)+'.'+MKEY.slice(5) : '')+' 남은 금액'));
  m.appendChild(el('b', c.left<0?'neg':'', wonp(c.left)));
  m.appendChild(el('span', null, '지출'));
  m.appendChild(el('b', null, won(c.totalOut)));
}
let miniVisible=false;
if(window.IntersectionObserver){
  new IntersectionObserver(es=>{
    miniVisible = !es[0].isIntersecting;
    $('#mini').hidden = !(miniVisible && !$('#view-month').hidden);
  },{threshold:0}).observe($('#summary'));
}

/* Alt + ← / → 로 달 이동 */
document.addEventListener('keydown',e=>{
  if(!e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); if(!$('#prev').disabled) $('#prev').click(); }
  if(e.key==='ArrowRight'){ e.preventDefault(); if(!$('#next').disabled) $('#next').click(); }
});

/* 처음 열었을 때 예시 데이터라는 걸 알린다 */
function showDemoNotice(){
  if(!MONTH || !MONTH.demo) return;
  notice('예시로 채워 둔 빈 장부입니다. 값을 고쳐 바로 쓰시거나, 오른쪽 위 ‘불러오기’로 내려받아 둔 파일을 넣으세요. '
       + '입력한 내용은 로그인 전에는 이 브라우저에만 저장됩니다.');
}
document.addEventListener('input', function once(){
  if(MONTH && MONTH.demo){ delete MONTH.demo; notice(''); save('month'); }
  document.removeEventListener('input', once);
}, true);

/* ---------- 저장소를 붙였다 뗐다 할 수 있게 ---------- */
async function startWith(db, label){
  if(unsubM){ unsubM(); unsubM=null; }
  if(unsubA){ unsubA(); unsubA=null; }
  DB=db; assetsLoaded=false; MONTH=null; ASSETS=null;
  undoStack=[]; redoStack=[]; committed=null; paintUndo();
  try{
    const snap=await DB.collection('months').get();
    MONTHS=snap.docs.map(d=>d.id).sort();
  }catch(e){ MONTHS=[]; }
  if(!MONTHS.length) MONTHS=[new Date().toISOString().slice(0,7)];
  openMonth(MONTHS[MONTHS.length-1]);
  unsubA = DB.doc('assets/main').onSnapshot(snap=>{
    const d = snap.exists ? snap.data() : {rows:[]};
    if(snap.metadata && snap.metadata.hasPendingWrites) return;
    if(savePending) return;
    if(JSON.stringify(d)===JSON.stringify(ASSETS)) return;
    ASSETS=clone(d);
    if(migrateAssets(ASSETS)) save('assets');
    renderAssets();
    if(!assetsLoaded){ assetsLoaded=true; if(MONTH) renderLedger(); }
  }, e=>setStatus('off','읽기 실패 ('+(e&&e.code||'')+')'));
  setStatus('saved', label);
  setTimeout(()=>{ committed=stateNow(); paintUndo(); }, 60);
}

function seedStore(){                       // 처음 열었을 때 넣어 줄 예시 장부
  const st={};
  Object.keys(SEED.months||{}).forEach(k=> st['months/'+k]=SEED.months[k]);
  if(SEED.assets) st['assets/main']=SEED.assets;
  return st;
}

/* ---------- 계정 ---------- */
function paintAccount(){
  const b=$('#btn-account');
  if(!CLOUD_ON){ b.hidden=true; return; }
  b.hidden=false;
  if(USER){
    b.textContent = USER.displayName || USER.email || '계정';
    b.classList.add('on');
    b.title='계정 · 함께 쓰기 · 로그아웃';
  }else{
    b.textContent='로그인'; b.classList.remove('on');
    b.title='구글 계정으로 로그인하면 두 사람이 여러 기기에서 같이 볼 수 있습니다';
  }
}
async function doLogin(){
  try{
    const prov=new firebase.auth.GoogleAuthProvider();
    await fbAuth.signInWithPopup(prov);
  }catch(e){
    if(e && e.code==='auth/popup-closed-by-user') return;
    notice('로그인하지 못했습니다 — '+(e && e.message || e));
  }
}
async function accountDialog(){
  const back=el('div','modal-back'), box=el('div','modal');
  box.appendChild(el('h3','modal-ttl','계정'));
  const info=el('div');
  const row=(k,v)=>{ const r=el('div','acct-row');
    r.appendChild(el('span','k',k)); r.appendChild(el('span','v',v)); info.appendChild(r); };
  row('로그인', USER.email || USER.displayName || '');
  row('가계부', (HOUSE&&HOUSE.name) || '우리 가계부');
  row('함께 쓰는 사람', ((HOUSE&&HOUSE.members)||[]).length + '명');
  box.appendChild(info);

  const cRow=el('div','acct-row'); cRow.appendChild(el('span','k','초대 코드'));
  box.appendChild(cRow);
  const codeBox=el('div','code-box');
  const codeEl=el('span','code','불러오는 중');
  codeBox.appendChild(codeEl);
  const copy=el('button','ghost','복사');
  copy.addEventListener('click',()=>{
    const t=codeEl.textContent;
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>showToast('초대 코드를 복사했습니다.'));
  });
  codeBox.appendChild(copy);
  box.appendChild(codeBox);
  box.appendChild(el('div','acct-note',
    '배우자분이 같은 주소에서 구글 로그인한 뒤 이 코드를 넣으면 같은 가계부를 함께 씁니다.'));

  const join=el('input','acct-in'); join.placeholder='받은 코드 넣기'; join.maxLength=6;
  box.appendChild(join);
  const err=el('div','acct-note'); err.style.color='var(--neg)'; box.appendChild(err);

  const foot=el('div','modal-foot');
  const out=el('button','ghost','로그아웃');
  const joinBtn=el('button','btn-primary','코드로 참여');
  const close=el('button','ghost','닫기');
  foot.appendChild(out); foot.appendChild(joinBtn); foot.appendChild(close);
  box.appendChild(foot); back.appendChild(box); document.body.appendChild(back);

  const shut=()=>{ back.remove(); document.removeEventListener('keydown',key,true); };
  const key=e=>{ if(e.key==='Escape'){ e.preventDefault(); shut(); } };
  document.addEventListener('keydown',key,true);
  back.addEventListener('mousedown',e=>{ if(e.target===back) shut(); });
  close.addEventListener('click',shut);
  out.addEventListener('click',async()=>{ shut(); await fbAuth.signOut(); });
  joinBtn.addEventListener('click',async()=>{
    err.textContent='';
    try{
      const hid=await joinByCode(join.value);
      shut();
      HID=hid;
      const h=await fbStore.doc('households/'+hid).get(); HOUSE=h.data();
      await startWith(cloudDB(hid), '함께 쓰는 가계부');
      showToast('같은 가계부에 참여했습니다.');
    }catch(e){ err.textContent = e && e.message || String(e); }
  });

  try{ codeEl.textContent = await inviteCode(); }
  catch(e){ codeEl.textContent='만들지 못함'; }
}
$('#btn-account').addEventListener('click',()=>{ USER ? accountDialog() : doLogin(); });

/* 로그인 직후, 브라우저에만 있던 내용을 서버로 올릴지 물어본다 */
async function offerUpload(localStore){
  const months=Object.keys(localStore).filter(k=>k.indexOf('months/')===0);
  const real=months.some(k=>{
    const m=localStore[k];
    return m && !m.demo;
  });
  if(!real) return false;
  const ok=await confirmDialog({
    title:'이 브라우저에 있던 가계부를 서버로 옮길까요?',
    body:'옮기면 다른 기기에서도 같은 내용을 보게 됩니다.',
    list:[months.length+'개 달의 기록', '자산 목록', '옮긴 뒤에도 이 브라우저 사본은 그대로 남습니다'],
    ok:'서버로 옮기기'});
  if(!ok) return false;
  for(const k of months) await DB.doc(k).set(localStore[k]);
  if(localStore['assets/main']) await DB.doc('assets/main').set(localStore['assets/main']);
  return true;
}

/* ---------- boot ---------- */
(async function(){
  paintAccount();
  const local=localDB();

  if(!CLOUD_ON){
    await startWith(local, lsOK? '이 브라우저에 저장됨' : '저장 안 됨');
    if(!lsOK) notice('이 브라우저에 저장할 수 없는 상태입니다. 작업 후 "파일로 저장"으로 백업해 주세요.');
    showDemoNotice();
    return;
  }

  firebase.initializeApp(window.FIREBASE_CONFIG);
  fbAuth=firebase.auth(); fbStore=firebase.firestore();
  try{ await fbStore.enablePersistence({synchronizeTabs:true}); }catch(e){}

  let started=false;
  fbAuth.onAuthStateChanged(async user=>{
    USER=user||null; paintAccount();
    if(user){
      setStatus('saving','가계부 여는 중');
      try{
        HID=await ensureHousehold(user);
        const h=await fbStore.doc('households/'+HID).get(); HOUSE=h.data();
        await startWith(cloudDB(HID), '서버에 저장됨');
        started=true;
        const empty=!MONTHS.length || (MONTH && MONTH.demo);
        if(empty || !MONTH) await offerUpload(local._store);
        notice('');
      }catch(e){
        setStatus('off','서버 연결 실패');
        notice('서버에 연결하지 못했습니다 — '+(e && e.message || e)+' · 브라우저 저장으로 계속합니다.');
        await startWith(local, '이 브라우저에 저장됨');
      }
    }else{
      await startWith(local, lsOK? '이 브라우저에 저장됨' : '저장 안 됨');
      showDemoNotice();
      started=true;
    }
  });
  setTimeout(()=>{ if(!started) startWith(local,'이 브라우저에 저장됨'); }, 6000);
})();
})();
</script>
